name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      ZEPHYR_BASE: ${{ github.workspace }}/deps/zephyr
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake device-tree-compiler file gperf libmagic1 libsdl2-dev \
            ninja-build pkg-config python3-dev python3-venv xz-utils

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add riscv32i-unknown-none-elf

      - name: Set up Zephyr workspace
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install west -r deps/zephyr/scripts/requirements-base.txt
          west init -l deps/zephyr
          cd deps
          west update --narrow --fetch-opt=--depth=1 hal_gigadevice
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Zephyr SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sdk_version=$(tr -d '[:space:]' < deps/zephyr/SDK_VERSION)
          minimal="zephyr-sdk-${sdk_version}_linux-x86_64_minimal.tar.xz"
          toolchain="toolchain_gnu_linux-x86_64_riscv64-zephyr-elf.tar.xz"
          mkdir -p "$RUNNER_TEMP/sdk-download" "$RUNNER_TEMP/zephyr-sdk/gnu"
          cd "$RUNNER_TEMP/sdk-download"
          gh release download "v${sdk_version}" --repo zephyrproject-rtos/sdk-ng \
            --pattern sha256.sum --pattern "$minimal" --pattern "$toolchain"
          grep -F "  $minimal" sha256.sum | sha256sum --check --strict
          grep -F "  $toolchain" sha256.sum | sha256sum --check --strict
          tar -xJf "$minimal" --strip-components=1 -C "$RUNNER_TEMP/zephyr-sdk"
          tar -xJf "$toolchain" -C "$RUNNER_TEMP/zephyr-sdk/gnu"
          "$RUNNER_TEMP/zephyr-sdk/setup.sh" -h
          echo "ZEPHYR_SDK_INSTALL_DIR=$RUNNER_TEMP/zephyr-sdk" >> "$GITHUB_ENV"

      - name: Check Rust formatting and tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked

      - name: Build Longan Nano and Lite firmware
        run: |
          cmake -GNinja -S . -B build/longan -DBOARD=longan_nano -DWEST_TOPDIR="$GITHUB_WORKSPACE/deps"
          cmake --build build/longan
          cmake -GNinja -S . -B build/lite -DBOARD=longan_nano/gd32vf103/lite -DWEST_TOPDIR="$GITHUB_WORKSPACE/deps"
          cmake --build build/lite

      - name: Build native simulator
        run: |
          cmake -GNinja -S . -B build/native -DBOARD=native_sim/native/64 \
            -DZEPHYR_TOOLCHAIN_VARIANT=host -DWEST_TOPDIR="$GITHUB_WORKSPACE/deps"
          cmake --build build/native

      - name: Check simulator startup
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          set +e
          timeout 5s ./build/native/zephyr/zephyr.exe --rt > "$RUNNER_TEMP/native-output.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/native-output.txt"
          if [ "$status" -ne 124 ]; then
            echo "Simulator exited unexpectedly with status $status"
            exit 1
          fi
          grep -Fx 'Hello, Zephyr World (native_sim/native/64)' "$RUNNER_TEMP/native-output.txt"
